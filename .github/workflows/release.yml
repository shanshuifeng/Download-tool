name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号（例如 v1.2.0）'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # 证书以 base64 存在 Secret 里（仓库不保存 .pfx）。未配置时自动降级为
      # 未签名发布，fork 与本机测试不会因此失败。
      HAS_CERT: ${{ secrets.DLTOOL_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # 版本号从 tag 传入：checkout 默认是浅克隆，脚本里的 git describe 未必能
      # 拿到 tag，所以显式给。--no-deploy 跳过桌面复制（runner 也没有桌面），
      # 便携包仍会生成。
      - name: 准备签名证书
        if: env.HAS_CERT == 'true'
        run: python tools/prepare_signing_cert.py
        env:
          DLTOOL_PFX_BASE64: ${{ secrets.DLTOOL_PFX_BASE64 }}

      - name: 打包（签名）
        if: env.HAS_CERT == 'true'
        run: python build_and_sign.py --no-deploy
        env:
          DLTOOL_USE_SYSTEM_PYTHON: '1'
          DLTOOL_VERSION: ${{ inputs.tag || github.ref_name }}
          DLTOOL_PFX_PASSWORD: ${{ secrets.DLTOOL_PFX_PASSWORD }}

      - name: 打包（未签名）
        if: env.HAS_CERT != 'true'
        run: python build_and_sign.py --no-sign --no-deploy
        env:
          DLTOOL_USE_SYSTEM_PYTHON: '1'
          DLTOOL_VERSION: ${{ inputs.tag || github.ref_name }}

      # 文件名全程 ASCII：Windows runner 的代码页会在上传环节丢掉中文，
      # 带中文的资产名会变成 default.exe / _.zip。理由见 tools/collect_artifacts.py。
      - name: 收集产物
        run: python tools/collect_artifacts.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/DownloadTool.exe
            dist/DownloadTool-portable.zip
            dist/DownloadTool.cer
          body: |
            Windows 多线程分段下载器，单文件交付，仅依赖 Python 标准库。

            - `DownloadTool.exe`：双击打开界面（程序名为「下载工具」）；带参数即命令行模式
            - `DownloadTool-portable.zip`：便携包，解压后直接使用，内含 `下载工具/` 目录
            - `DownloadTool.cer`：签名的公钥证书，可选导入（见下）

            资产名用 ASCII 是刻意的：CI 跑在 Windows 上，带中文的文件名会在上传环节
            被代码页丢掉（曾出现 `下载工具_便携版.zip` 变成 `_.zip`）。程序本身与
            便携包内部仍是中文名。

            **签名**：产物用项目自签名证书签名，签名者 `shanshuifeng`。证书非商业 CA
            签发，Windows 默认不信任，因此仍提示「未知发布者」。希望系统直接认可该签名，
            把 `DownloadTool.cer` 导入「受信任的根证书颁发机构」即可（仅影响本机）：

            ```powershell
            Import-Certificate -FilePath DownloadTool.cer -CertStoreLocation Cert:\CurrentUser\Root
            ```

            无论是否导入，都可用 `certutil -hashfile DownloadTool.exe SHA256` 与本页
            显示的摘要比对，确认文件未被改动。

            项目地址：https://github.com/shanshuifeng/Download-tool
            许可：Apache-2.0
